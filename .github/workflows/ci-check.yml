name: ci-check

on:
  push:
    branches: [ci-check]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: 构建 amd64 镜像（不推送）
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: manju-studio:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: 冒烟测试
        run: |
          docker run -d --name mj -e ADMIN_PASSWORD=ci -p 8080:8080 manju-studio:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/api/health && break; sleep 1; done
          curl -sf http://127.0.0.1:8080/api/health
          docker exec mj ffmpeg -version | head -1
          docker logs mj
